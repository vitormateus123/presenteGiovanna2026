name: Inspecionar pacote
on:
  push:
    branches: [refatorar-design]
permissions:
  contents: read
jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listar conteúdo do ZIP
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("presenteGiovanna2026-refatorado.zip") as package:
              for item in package.infolist():
                  print(f"{item.file_size:>10} {item.filename}")
          PY
